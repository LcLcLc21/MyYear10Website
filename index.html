<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>10 DGT portfolio</title>
</head>
<!-- This is the main body of the website- ALL your content goes AFTER the <body> tag and before the </body> tag -->
<body>

    <!-- The Hero Section -------------------------------------------------------------------------------------- -->
    <section class="hero">
        <div class="hero-text">Larry's 10 DGT creations</div>
    </section>

<!-- Topic one ------------------------------------------------------------------------------------------------- -->
    <!-- The First Topic Section -->
    <section class="topic">
        <!-- the topic title a big bar with text in it -->
        <div class="topic-title">
            <h1>Image Manipulation</h1>
        </div>
        <!-- now a three column grid of images -->
        <div class="topic-content">
            <!-- one "card" which includes an image with a text below it -->
            <div class="topic-card">
                <img src="images/background.png" alt="Background_canyon">
                <h2 class="topic-card-text">Vector Background art</h2>
            </div>
            <div class="topic-card">
                <img src="images/alien.png" alt="Alien!">
                <h2 class="topic-card-text">Greenscreen project</h2>
            </div>
            <div class="topic-card">
                <img src="images/Dumbss.PNG" alt="Little guy!">
                <h2 class="topic-card-text">My character I made</h2>
            </div>
        </div>
    </section>
<!-- End of topic one------------------------------------------------------------------------------------------ -->

<!-- Copy and paste the section from above to make your next section -->
    <section class="topic">
        <!-- the topic title a big bar with text in it -->
        <div class="topic-title">
            <h1>Design for manufacturing</h1>
        </div>
        <!-- now a three column grid of images -->
        <div class="topic-content">
            <!-- one "card" which includes an image with a text below it -->
            <div class="topic-card">
                <img src="images/Lego brick.PNG" alt="Just a lego brick nothing special">
                <h2 class="topic-card-text">Lego Brick</h2>
            </div>
            <div class="topic-card">
                <img src="images/Larrysnowman.PNG" alt="Snowman just like Snom">
                <h2 class="topic-card-text">Snom the Snowman</h2>
            </div>
            <div class="topic-card">
                <img src="images/bed.PNG" alt="A very comfy bedroom">
                <h2 class="topic-card-text">A Bedroom</h2>
            </div>
        </div>
    </section>
<!-- End of topic one------------------------------------------------------------------------------------------ -->
    <section class="topic">
        <!-- the topic title a big bar with text in it -->
        <div class="topic-title">
            <h1>3D Modeling</h1>
        </div>
        <!-- now a three column grid of images -->
        <div class="topic-content">
            <!-- one "card" which includes an image with a text below it -->
            <div class="topic-card">
                <img src="images/ITSACAR.PNG" alt="A 3D model of a car">
                <h2 class="topic-card-text">3D Model of a Car</h2>
            </div>
            <div class="topic-card">
                <img src="images/Phoneboothingy.PNG" alt="Very British phonebooth">
                <h2 class="topic-card-text">3D Model of a Phone Booth</h2>
            </div>
            <div class="topic-card">
                <img src="images/Larry'sHeiMatau.PNG" alt="A HeiMatu I 3D modeled">

            </div>
        </div>
    </section>


    
    <!-- A Simple Website Footer ------------------------------------------------------------------------------ -->
    <footer class="footer">
        <p>&copy; 2026 Larry's showcase website</p>
    </footer>

<!-- The end of the whole page- no more content after this! -->

</html>
